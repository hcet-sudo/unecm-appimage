name: Build and release

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["build/**", "external/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  unecm:
    # ubuntu-24.04, NOT ubuntu-latest: newer runner images ship the amd64v3
    # archive variant, whose prebuilt static glibc is compiled for x86-64-v3 —
    # linking it would SIGILL these baseline binaries on older CPUs even with
    # the compiler shim in build-unecm.sh. Noble's archive is plain x86-64-v1.
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        run: echo "ver=1.0" >> "$GITHUB_OUTPUT"

      - name: Build static unecm AppImage
        run: bash build/build-unecm.sh

      - name: Self-test
        run: bash build/self-test-unecm.sh dist/unecm-x86_64.AppImage dist/ecm

      - name: Baseline-ISA gate (x86-64-v1 via qemu)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static >/dev/null
          ./dist/unecm-x86_64.AppImage --appimage-extract >/dev/null
          # The extracted inner binary runs under an emulated baseline v1 CPU:
          # any v2+ instruction (from our code OR prebuilt static glibc) dies
          # with SIGILL and blocks the release.
          EMU_PREFIX="qemu-x86_64-static -cpu qemu64" \
            bash build/self-test-unecm.sh squashfs-root/usr/bin/unecm dist/ecm

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/unecm-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [unecm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum unecm-x86_64.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release (pkgforge-style versioned tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.unecm.outputs.ver }}
        run: |
          TAG="${VER}@$(date -u +%F)_$(date -u +%s)"
          cat > notes.md <<EOF
          Unofficial, fully static AppImage of **unecm ${VER}** (ECM decoder by
          Neill Corlett). No system libraries needed — runs on any x86_64
          Linux regardless of distribution or glibc age.

          ## Install with am / appman
          \`\`\`
          am -e https://github.com/${{ github.repository }} unecm unecm
          \`\`\`

          ## Or grab directly (stable URL)
          \`\`\`
          curl -LO https://github.com/${{ github.repository }}/releases/latest/download/unecm-x86_64.AppImage
          chmod +x unecm-x86_64.AppImage
          \`\`\`

          ## Typical workflow (.bin.ecm -> .bin)
          \`\`\`
          ./unecm-x86_64.AppImage game.bin.ecm          # writes game.bin
          \`\`\`

          Continue to a compressed .chd with
          [chdman](https://github.com/${{ github.repository_owner }}/chdman-appimage/releases/latest):
          \`./chdman-x86_64.AppImage createcd -i game.cue -o game.chd\`.

          Built and functionally self-tested in CI on every release
          (bit-perfect ECM roundtrip). See SHA256SUMS.txt for checksums.
          EOF
          gh release create "$TAG" \
            dist/unecm-x86_64.AppImage \
            dist/SHA256SUMS.txt \
            --title "unecm: ${VER}" \
            --notes-file notes.md \
            --latest
